[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bibilab"]

[project]
name = "bibilab"
version = "0.1.0"
description = "Bibilab backend — personal video knowledge base"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=0.30.0",
    "chromadb>=1.5.5",
    "fastapi>=0.135.2",
    "ffmpeg-python>=0.2.0",
    "httpx>=0.28.1",
    "openai>=1.0.0",
    "tiktoken>=0.12.0",
    "uvicorn[standard]>=0.42.0",
    "numpy>=2.0.0",
    "onnxruntime>=1.20.0",
    "tokenizers>=0.22.0",
    "yt-dlp[curl-cffi]>=2026.3.17",
    "pypinyin>=0.55.0",
    "sherpa-onnx>=1.13.7",
    # sherpa-onnx's wheel is a thin Python binding; the actual libonnxruntime.so it
    # dlopens ships in this separate, per-platform sherpa-onnx-core wheel (not the
    # unrelated PyPI `onnxruntime` package above — a different build, ABI-incompatible).
    # sherpa-onnx's own metadata declares it as a transitive dependency, but uv doesn't
    # reliably resolve it (a known issue with sherpa-onnx's dynamic METADATA), so it's
    # pinned here explicitly — exact version match required.
    "sherpa-onnx-core==1.13.7",
    "soundfile>=0.13.1",
]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.8",
]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that drive the ASGI app via the `client` fixture or hit real SQLite/Chroma",
]
